name: Build

on:
  push:
    paths:
      - loak/**
      - loakApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/build.yml
      - "!**/strings.xml"
    tags:
      - 'v*'
    branches:
      - '*'
  pull_request:
    paths:
      - loak/**
      - loakApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle (release)
        id: build_release
        if: github.event_name == 'push' && env.SIGNING_KEY_ALIAS
        env:
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          ./gradlew :loakApp:packageRelease --stacktrace
          mv loakApp/build/outputs/apk/**/*.apk ./
          rm release.keystore

      - name: Build with Gradle (nightly)
        id: build_nightly
        if: github.event_name == 'push' && env.SIGNING_KEY_ALIAS && startsWith(github.ref, 'refs/heads/main')
        env:
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          version_code=$(( $(git show -s --format=%ct HEAD) / 60 ))
          version_name="v1.0.0-alpha58-nightly.${GITHUB_SHA::7}"
          ./gradlew :loakApp:packageRelease -Pnightly=true \
            -PversionCode="$version_code" -PversionName="$version_name" --stacktrace
          mkdir -p nightly
          mv loakApp/build/outputs/apk/**/*.apk "nightly/Lo'ak.nightly.apk"
          rm release.keystore

      - name: Build with Gradle (debug)
        id: build_debug
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :loakApp:assembleDebug --stacktrace
          mv loakApp/build/outputs/apk/**/*.apk ./

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: loak-release-android
          path: ./*.apk
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload nightly artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: loak-nightly-android
          path: nightly/*.apk
          compression-level: 0
          if-no-files-found: ignore

  build-ios:
    name: iOS
    if: false # iOS build disabled for now; remove this line to re-enable
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run Gradle tasks
        run: ./gradlew :loak:generateValkyrieImageVector

      - name: Build IPA
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "iosApp.xcarchive" \
            CODE_SIGN_ENTITLEMENTS="iosApp/entitlements.xml" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload

          APP_PATH=$(find "iosApp.xcarchive/Products/Applications" -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/

          zip -r "Lo'ak.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loak-release-ios
          path: Lo'ak.ipa
          compression-level: 0
          if-no-files-found: ignore

  publish-nightly:
    name: Publish Nightly Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    needs: [ build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download nightly artifact
        uses: actions/download-artifact@v7
        with:
          name: loak-nightly-android
          path: nightly

      - name: Tag and create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="nightly/$(date -u +%F)-${GITHUB_SHA::7}"

          # Fresh release per commit; drop any previous run of this exact tag
          # (re-runs) before recreating it.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

          git tag --force "$TAG"
          git push --force origin "refs/tags/$TAG"

          gh release create "$TAG" nightly/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly $TAG" \
            --notes "Nightly build of \`main\` (${{ github.sha }})." \
            --prerelease

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7

      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar

          # Release notes = commits since the previous tag (empty if none)
          BODY=$(git log --oneline --no-merges "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)..HEAD" 2>/dev/null || true)

          gh release create "$GITHUB_REF_NAME" **/*.{apk,ipa} \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$BODY" \
            --draft
