name: Build

on:
  push:
    paths:
      - loak/**
      - loakApp/**
      - loakDesktop/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/build.yml
      - "!**/strings.xml"
    tags:
      - 'v*'
    branches:
      - '*'
  pull_request:
    paths:
      - loak/**
      - loakApp/**
      - loakDesktop/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle (release)
        id: build_release
        if: github.event_name == 'push' && env.SIGNING_KEY_ALIAS
        env:
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          ./gradlew :loakApp:packageRelease --stacktrace
          mv loakApp/build/outputs/apk/**/*.apk ./
          rm release.keystore

      - name: Build with Gradle (nightly)
        id: build_nightly
        if: github.event_name == 'push' && env.SIGNING_KEY_ALIAS && startsWith(github.ref, 'refs/heads/main')
        env:
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          version_code=$(( $(git show -s --format=%ct HEAD) / 60 ))
          version_name="v1.0.0-alpha58-nightly.${GITHUB_SHA::7}"
          ./gradlew :loakApp:packageRelease -Pnightly=true \
            -PversionCode="$version_code" -PversionName="$version_name" --stacktrace
          mkdir -p nightly
          mv loakApp/build/outputs/apk/**/*.apk "nightly/Lo'ak.nightly.apk"
          rm release.keystore

      - name: Build with Gradle (debug)
        id: build_debug
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :loakApp:assembleDebug --stacktrace
          mv loakApp/build/outputs/apk/**/*.apk ./

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: loak-release-android
          path: ./*.apk
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload nightly artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: loak-nightly-android
          path: nightly/*.apk
          compression-level: 0
          if-no-files-found: ignore

  build-ios:
    name: iOS
    if: false # iOS build disabled for now; remove this line to re-enable
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run Gradle tasks
        run: ./gradlew :loak:generateValkyrieImageVector

      - name: Build IPA
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "iosApp.xcarchive" \
            CODE_SIGN_ENTITLEMENTS="iosApp/entitlements.xml" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload

          APP_PATH=$(find "iosApp.xcarchive/Products/Applications" -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/

          zip -r "Lo'ak.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loak-release-ios
          path: Lo'ak.ipa
          compression-level: 0
          if-no-files-found: ignore

  build-desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-26, windows-latest, windows-11-arm ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Nucleus packages through electron-builder, which needs Node.js >= 20.19 (require(esm))
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # electron-builder's AppImage step needs FUSE 2
      - name: Install AppImage dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libfuse2t64

      # The Nucleus updater compares the app version (nucleus.app.version) against the
      # release manifest, so on a v* tag the packaged version must be the tag with the v
      # stripped (v1.0.0-alpha58 -> 1.0.0-alpha58). Non-tag builds keep the neutral
      # "1.0.0", which matches no published release, so they never announce an update.
      - name: Compute package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "package_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "package_version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build desktop package
        shell: bash
        run: |
          # Run each format as its own gradle invocation: on Linux/Windows the
          # per-OS formats share the intermediate app-image output, so the
          # multi-format packageDistributionForCurrentOS task graph collides.
          case "${{ runner.os }}" in
            macOS)
              ./gradlew :loakDesktop:packageDmg --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}"
              ./gradlew :loakDesktop:packageZip --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}"
              ;;
            Windows)
              ./gradlew :loakDesktop:packageMsi --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}"
              ./gradlew :loakDesktop:packageExe --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}"
              ;;
              *)
              ./gradlew :loakDesktop:packageDeb --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}"
              ./gradlew :loakDesktop:packageRpm --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}"
              ./gradlew :loakDesktop:packageAppImage --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}"
              ;;
          esac
      - name: Build portable archive
        shell: bash
        run: |
          # Linux: tar.gz preserves executable bits on launchers and shared libs.
          # Windows: zip is the portable standard (built via PowerShell).
          # macOS needs NO manual archive: TargetFormat.Zip now builds the
          # auto-updatable zip (with blockmap) via electron-builder.
          case "${{ runner.os }}" in
            Linux)
              tar -czf "loakDesktop/build/compose/binaries/main/Loak-Linux.tar.gz" \
                -C loakDesktop/build/compose/binaries/main/app .
              ;;
            Windows)
              powershell -NoProfile -Command \
                "Compress-Archive -Path 'loakDesktop/build/compose/binaries/main/app/*' -DestinationPath 'loakDesktop/build/compose/binaries/main/Loak-${{ runner.arch }}-Windows.zip' -Force"
              ;;
          esac

      - name: Collect desktop installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # packageDistributionForCurrentOS writes installers + their .blockmap
          # companions into build/compose/binaries/main/{,app/}. Keep installers,
          # the portable archives, and the blockmap companions (the updater needs
          # .blockmap for differential downloads on subsequent updates). If a format
          # emitted its own latest-*.yml (MSI/Portable do), collect it too.
          while IFS= read -r -d '' f; do
            case "$f" in
              *.deb|*.rpm|*.AppImage|*.msi|*.exe|*.dmg|*.pkg|*.zip|*.tar.gz|*.blockmap|latest-*.yml) cp "$f" dist/ ;;
            esac
          done < <(find loakDesktop/build/compose/binaries/main -type f -not -path '*/app/*' -print0)
          ls -la dist/

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v6
        with:
          name: loak-desktop-${{ matrix.os }}
          path: dist/
          compression-level: 0
          if-no-files-found: error

  publish-nightly:
    name: Publish Nightly Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    needs: [ build-android, build-desktop ]
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-publish
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download nightly android
        uses: actions/download-artifact@v7
        with:
          name: loak-nightly-android
          path: nightly

      - name: Download desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-*
          path: desktop
          merge-multiple: true

      - name: Tag and create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          FILES=( nightly/* desktop/* )

          # Stable `nightly` tag: replaced on every main push, so installs always
          # track the latest tip. Old release/tag are dropped first.
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

          # `gh release create` creates both the tag and the release; no git
          # push needed (avoids the workflow-file ref-push guard).
          gh release create nightly "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --notes "Nightly build of \`main\` (${{ github.sha }})." \
            --prerelease

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ build-android, build-desktop ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v7
        with:
          name: loak-release-android
          path: artifacts/release-assets-android

      # The Nucleus generate-update-yml/publish-release composite actions scan
      # for `release-assets-*` directories; one per OS keeps the per-platform
      # latest-*.yml / alpha-*.yml manifests unambiguous (desktop artifacts
      # keep their `.blockmap` companions from the build-desktop step).
      - name: Download Linux desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-ubuntu-latest
          path: artifacts/release-assets-linux
          merge-multiple: true

      - name: Download macOS desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-macos-26
          path: artifacts/release-assets-macos
          merge-multiple: true

      - name: Download Windows desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-windows-latest
          path: artifacts/release-assets-windows
          merge-multiple: true

      - name: Download Windows arm64 desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-windows-11-arm
          path: artifacts/release-assets-windows
          merge-multiple: true

      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Version = tag minus the leading v; this must match the packaged
      # nucleus.app.version (build-desktop passes -PpackageVersion=${{ tag#v }})
      # and the release tag, so the updater's getDownloadUrl resolves
      # /releases/download/v{version}/{file}.
      - name: Compute release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate update YML
        uses: NucleusFramework/Nucleus/.github/actions/generate-update-yml@v2.5.18
        with:
          artifacts-path: artifacts
          version: ${{ steps.version.outputs.version }}
          channel: alpha

      # Published as `prerelease` on purpose (publish-release auto-generates
      # notes): GitHub's /releases/latest/* endpoints and the alpha channel
      # lookup only resolve published, non-draft releases — the auto-updater
      # cannot reach a draft.
      - name: Publish Release
        uses: NucleusFramework/Nucleus/.github/actions/publish-release@v2.5.18
        with:
          artifacts-path: artifacts
          tag: ${{ github.ref_name }}
          release-type: prerelease
