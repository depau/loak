name: Build

on:
  push:
    paths:
      - loak/**
      - loakApp/**
      - loakDesktop/**
      - loakUiTest/**
      - iosApp/**
      - buildSrc/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - .gitattributes
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/build.yml
      - "!**/strings.xml"
    tags:
      - 'v*'
    branches:
      - '*'
  pull_request:
    paths:
      - loak/**
      - loakApp/**
      - loakDesktop/**
      - loakUiTest/**
      - iosApp/**
      - buildSrc/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - .gitattributes
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Main's runs are never cancelled in flight: the iOS job needs ~45 min, and
  # `publish-nightly` is gated on it, so a run cancelled by the next push
  # publishes nothing -- on a main that gets pushed more often than that, no
  # nightly ever lands. The group still serializes main's runs (GitHub drops the
  # older *pending* one, so there is one pipeline of lag, not a pile-up), and
  # branches, PRs and tags still cancel, where nothing waits on the older commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build with Gradle (release)
        id: build_release
        if: github.event_name == 'push' && env.SIGNING_KEY_ALIAS
        env:
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: loak
          SENTRY_PROJECT: loak
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          ./gradlew :loakApp:packageRelease --stacktrace
          mv loakApp/build/outputs/apk/**/*.apk ./
          rm release.keystore
          .github/scripts/upload-sentry-mapping.sh "Lo'ak.apk"

      - name: Build with Gradle (nightly)
        id: build_nightly
        if: github.event_name == 'push' && env.SIGNING_KEY_ALIAS && startsWith(github.ref, 'refs/heads/main')
        env:
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: loak
          SENTRY_PROJECT: loak
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          version_code=$(( $(git show -s --format=%ct HEAD) / 60 ))
          version_name="v1.0.0-alpha58-nightly.${GITHUB_SHA::7}"
          ./gradlew :loakApp:packageRelease -Pnightly=true \
            -PversionCode="$version_code" -PversionName="$version_name" --stacktrace
          mkdir -p nightly
          nightly_apk="Lo.ak-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.apk"
          mv loakApp/build/outputs/apk/**/*.apk "nightly/$nightly_apk"
          rm release.keystore
          .github/scripts/upload-sentry-mapping.sh "nightly/$nightly_apk"

      - name: Build with Gradle (debug)
        id: build_debug
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :loakApp:assembleDebug --stacktrace
          mv loakApp/build/outputs/apk/**/*.apk ./

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: loak-release-android
          path: ./*.apk
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload nightly artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: loak-nightly-android
          path: nightly/*.apk
          compression-level: 0
          if-no-files-found: ignore

  build-ios:
    name: iOS
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # the Kotlin/Native toolchain; like Gradle's cache, only main writes it.
      # Keyed on the Kotlin version alone: ~/.konan holds the compiler,
      # dependencies and platform libs, which change only when that does -- keying
      # it on every gradle script made each run restore an older entry and re-save
      # a fresh ~1 GB one for no gain.
      - name: Restore konan
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run Gradle tasks
        run: ./gradlew :loak:generateValkyrieImageVector

      - name: Build IPA
        env:
          IS_NIGHTLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          rm -rf Payload ios
          mkdir -p Payload ios

          ipa_name="Loak.ipa"
          # Expanded with `${arr[@]+...}` below: bash 3.2 (macOS' /bin/bash) treats
          # `"${arr[@]}"` on an empty array as an unbound variable under `set -u`,
          # which is every run where IS_NIGHTLY is false -- manual dispatch, v* tags.
          xcode_overrides=()
          if [[ "$IS_NIGHTLY" == "true" ]]; then
            ipa_name="Loak-nightly.ipa"
            xcode_overrides+=(
              LOAK_DISPLAY_NAME="Loak Nightly"
              LOAK_PRODUCT_BUNDLE_IDENTIFIER="eu.depau.loak.nightly"
              LOAK_PROJECT_BUILD_VERSION="$GITHUB_RUN_NUMBER"
            )
          fi

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "iosApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ${xcode_overrides[@]+"${xcode_overrides[@]}"}

          app_path="$(find "iosApp.xcarchive/Products/Applications" -name "*.app" -print -quit)"
          cp -R "$app_path" Payload/
          zip -qry "ios/$ipa_name" Payload

      - name: Save konan
        if: github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: loak-ios
          path: ios/*.ipa
          compression-level: 0
          if-no-files-found: error

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Shared-logic unit tests. Runs on every PR/push and gates nightlies + releases;
    # the UI tests and user flows run per OS in build-desktop.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run unit tests (JVM)
        run: |
          ./gradlew :loak:desktopTest --stacktrace

  ui-flows-android:
    name: User flows (Android)
    runs-on: ubuntu-latest
    # The user flows on the real Android app, R8-minified like the nightly (the `minified`
    # build type), in a Gradle-managed headless emulator, against the Navidrome fixture on
    # the host. Gates nightlies + releases.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # the emulator needs hardware acceleration
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build first, then free the build's memory before the emulator boots: Gradle (8 GB
      # heap), the Kotlin daemon and R8 next to the emulator exhaust the runner, which
      # then shuts down mid-run
      - name: Build the app and its user flows
        run: |
          ./gradlew :loakApp:assembleMinified :loakApp:assembleMinifiedAndroidTest --stacktrace \
            -Ploak.uiTestBuildType=minified
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          free -h

      - name: Run user flows
        run: |
          ./gradlew :loakApp:uiFlowsPhoneMinifiedAndroidTest --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx2g \
            -Ploak.uiTestBuildType=minified \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-failures-android
          path: |
            loakApp/build/reports/androidTests/
            loakApp/build/outputs/androidTest-results/
            build/navidrome-fixture/navidrome.log
          if-no-files-found: ignore

  build-desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel is the last GitHub-hosted Intel macOS image (to Aug 2027);
        # macOS 26 only ships on Apple Silicon. The desktop build is a JVM target so
        # it crosses archs fine; it produces the same mac-x64 artifacts on Intel hosts.
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-26, macos-15-intel, windows-latest, windows-11-arm ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Nucleus packages through electron-builder, which needs Node.js >= 20.19 (require(esm))
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # electron-builder's AppImage step needs FUSE 2 and its RPM step rpmbuild; Nucleus' patched
      # natives (loakDesktop/nucleus) build against GTK 3 (Tao) and ALSA (rodio)
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 rpm libgtk-3-dev libdbus-1-dev libx11-dev libglib2.0-dev libasound2-dev pkg-config

      # the build compiles Nucleus' patched natives (loakDesktop/nucleus) with cargo
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The desktop UI tests, user flows included: the real app against a pinned Navidrome
      # (see loakUiTest), on every OS the installers are built for. A failure blocks the nightly.
      # The user flows check playback actually starts wherever there's an audio output:
      # give the runners a virtual one (no driver for Windows on ARM: its flows only
      # check the player picks the song up)
      - name: Set up a virtual audio output (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/setup-virtual-audio.sh

      - name: Set up a virtual audio output (macOS, Windows x64)
        if: runner.os == 'macOS' || matrix.os == 'windows-latest'
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4

      - name: Run UI tests and user flows
        run: ./gradlew :loakDesktop:desktopTest --stacktrace

      - name: Upload UI test failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-failures-desktop-${{ matrix.os }}
          path: |
            loakDesktop/build/ui-test-failures/
            loakDesktop/build/reports/tests/desktopTest/
            build/navidrome-fixture/navidrome.log
          if-no-files-found: ignore

      # Tagged packages use the tag version. Main builds get a monotonically increasing
      # numeric semver so jpackage accepts it and the fixed `nightly` release can update
      # one nightly installation to the next. The separate channel property selects the
      # nightly updater at runtime.
      - name: Compute package version
        id: version
        shell: bash
        run: |
          channel="release"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version="1.0.${GITHUB_RUN_NUMBER}"
            channel="nightly"
          else
            version="1.0.0"
            channel="dev"
          fi
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
          echo "update_channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Build desktop package
        shell: bash
        run: |
          # Transient infra flake: on a slow runner (windows-11-arm) Gradle's
          # buildFinished listener flush can time out *after* the package is
          # written ("Timeout waiting for concurrent jobs to complete"), failing
          # the build for nothing. A rerun sees the task up-to-date and is fast;
          # a real failure still fails every attempt.
          retry() {
            local n=3
            for i in $(seq 1 "$n"); do
              if "$@"; then return 0; fi
              echo "::warning::Gradle run failed (attempt $i/$n); retrying: $*"
            done
            return 1
          }
          # Run each format as its own gradle invocation: on Linux/Windows the
          # per-OS formats share the intermediate app-image output, so the
          # multi-format packageDistributionForCurrentOS task graph collides.
          case "${{ runner.os }}" in
            macOS)
              retry ./gradlew :loakDesktop:packageDmg --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}" -PupdateChannel="${{ steps.version.outputs.update_channel }}"
              retry ./gradlew :loakDesktop:packageZip --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}" -PupdateChannel="${{ steps.version.outputs.update_channel }}"
              ;;
            Windows)
              retry ./gradlew :loakDesktop:packageMsi --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}" -PupdateChannel="${{ steps.version.outputs.update_channel }}"
              retry ./gradlew :loakDesktop:packageExe --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}" -PupdateChannel="${{ steps.version.outputs.update_channel }}"
              ;;
              *)
              retry ./gradlew :loakDesktop:packageDeb --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}" -PupdateChannel="${{ steps.version.outputs.update_channel }}"
              retry ./gradlew :loakDesktop:packageRpm --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}" -PupdateChannel="${{ steps.version.outputs.update_channel }}"
              retry ./gradlew :loakDesktop:packageAppImage --stacktrace -PpackageVersion="${{ steps.version.outputs.package_version }}" -PupdateChannel="${{ steps.version.outputs.update_channel }}"
              ;;
          esac
      - name: Build portable archive
        shell: bash
        run: |
          # Linux: tar.gz preserves executable bits on launchers and shared libs.
          # Windows: zip is the portable standard (built via PowerShell).
          # macOS needs NO manual archive: TargetFormat.Zip now builds the
          # auto-updatable zip (with blockmap) via electron-builder.
          case "${{ runner.os }}" in
            Linux)
              tar -czf "loakDesktop/build/compose/binaries/main/Loak-${{ runner.arch }}-Linux.tar.gz" \
                -C loakDesktop/build/compose/binaries/main/app .
              ;;
            Windows)
              powershell -NoProfile -Command \
                "Compress-Archive -Path 'loakDesktop/build/compose/binaries/main/app/*' -DestinationPath 'loakDesktop/build/compose/binaries/main/Loak-${{ runner.arch }}-Windows.zip' -Force"
              ;;
          esac

      - name: Collect desktop installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # packageDistributionForCurrentOS writes installers + their .blockmap
          # companions into build/compose/binaries/main/{,app/}. Keep installers,
          # the portable archives, and the blockmap companions (the updater needs
          # .blockmap for differential downloads on subsequent updates). If a format
          # emitted its own latest-*.yml (MSI/Portable do), collect it too.
          while IFS= read -r -d '' f; do
            case "$f" in
              *.deb|*.rpm|*.AppImage|*.msi|*.exe|*.dmg|*.pkg|*.zip|*.tar.gz|*.blockmap|latest-*.yml) cp "$f" dist/ ;;
            esac
          done < <(find loakDesktop/build/compose/binaries/main -type f -not -path '*/app/*' -print0)
          ls -la dist/

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v6
        with:
          name: loak-desktop-${{ matrix.os }}
          path: dist/
          compression-level: 0
          if-no-files-found: error

  publish-nightly:
    name: Publish Nightly Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    needs: [ test, ui-flows-android, build-android, build-ios, build-desktop ]
    runs-on: ubuntu-latest
    concurrency:
      # Serializes publishers and never interrupts one: the release and its tag
      # are deleted and re-created under the same `nightly` tag, so a publish
      # cancelled half-way leaves the tag pointing at a partial release. A newer
      # run's publish takes the queue slot instead (GitHub drops the older
      # pending one), so the newest build still wins.
      group: nightly-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download nightly android
        uses: actions/download-artifact@v7
        with:
          name: loak-nightly-android
          path: nightly

      - name: Download nightly iOS
        uses: actions/download-artifact@v7
        with:
          name: loak-ios
          path: ios

      # Keep one directory per platform: generate-update-yml merges both architectures
      # into one manifest and preserves each installer's blockmap companion.
      - name: Download Linux desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-ubuntu-latest
          path: artifacts/release-assets-linux
          merge-multiple: true

      - name: Download Linux arm64 desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-ubuntu-24.04-arm
          path: artifacts/release-assets-linux
          merge-multiple: true

      - name: Download macOS desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-macos-26
          path: artifacts/release-assets-macos
          merge-multiple: true

      - name: Download Intel macOS desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-macos-15-intel
          path: artifacts/release-assets-macos
          merge-multiple: true

      - name: Download Windows desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-windows-latest
          path: artifacts/release-assets-windows
          merge-multiple: true

      - name: Download Windows arm64 desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-windows-11-arm
          path: artifacts/release-assets-windows
          merge-multiple: true

      - name: Compute nightly version
        id: nightly_version
        shell: bash
        run: echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Portable archives cannot self-update and are renamed below. Keep them out
      # of the installer manifest so every listed URL remains valid.
      - name: Exclude portable archives from nightly metadata
        shell: bash
        run: |
          mkdir -p artifacts/portable-assets
          find artifacts/release-assets-* -type f \
            \( -name 'Loak-*-Linux.tar.gz' -o -name 'Loak-*-Windows.zip' \) \
            -exec mv {} artifacts/portable-assets/ \;

      - name: Generate nightly update YML
        uses: NucleusFramework/Nucleus/.github/actions/generate-update-yml@v2.5.18
        with:
          artifacts-path: artifacts
          version: ${{ steps.nightly_version.outputs.version }}
          channel: latest

      - name: Restore portable nightly archives
        shell: bash
        run: |
          mkdir -p artifacts/release-assets-portable
          find artifacts/portable-assets -type f \
            -exec mv {} artifacts/release-assets-portable/ \;
          rmdir artifacts/portable-assets

      - name: Tag and create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Per-build unique token: every main push rebuilds over the same `nightly`
          # tag, so give the assets a date+sha so parallel installs never collide
          # and users can tell which build they grabbed. Derive it from the Android
          # APK's name (built as Lo.ak-nightly-<date>-<sha>.apk in build-android) so
          # every asset shares one token even if the build and publish runs straddle
          # a UTC day boundary.
          token="$(basename nightly/*.apk .apk)"
          token="${token#Lo.ak-}"

          # Installers already carry the unique, monotonic nightly version. Portable archives
          # are versionless, so add the same human-readable token used by the APK.
          for f in artifacts/release-assets-*/Loak-*-Linux.tar.gz \
                   artifacts/release-assets-*/Loak-*-Windows.zip; do
            [ -e "$f" ] || continue
            dir="${f%/*}"
            name="${f##*/}"
            mv "$f" "$dir/${name/Loak-/Loak-${token}-}"
          done

          FILES=( nightly/* ios/* artifacts/update-yml/* )
          while IFS= read -r -d '' f; do
            case "$f" in
              *.yml|*.yaml) ;;
              *) FILES+=( "$f" ) ;;
            esac
          done < <(find artifacts/release-assets-* -type f -print0)

          # The Nightly AltSource is paired with the Nightly IPA it points to;
          # both are re-published together under the same `nightly` tag. The
          # manifest sits in the release so its URL stays stable while the IPA
          # underneath it rotates.
          .github/scripts/update-altsource.sh \
            --ipa ios/Loak-nightly.ipa \
            --source app-repo.json \
            --base "https://github.com/depau/loak/releases/download/nightly" \
            --ipa-name Loak-nightly.ipa
          FILES+=( app-repo.json )

          notes="$(
            .github/scripts/generate-release-notes.sh \
              "Nightly build of \`main\` (${GITHUB_SHA::7})." \
              nightly \
              "loak-${{ steps.nightly_version.outputs.version }}-" \
              "Loak-${token}-" \
              "Lo.ak-${token}.apk" \
              "Loak-nightly.ipa" \
              "nightly"
          )"

          # Stable `nightly` tag: replaced on every main push, so installs always
          # track the latest tip. Old release/tag are dropped first.
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

          # `gh release create` creates both the tag and the release; no git
          # push needed (avoids the workflow-file ref-push guard).
          gh release create nightly "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --notes "$notes" \
            --prerelease

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ test, ui-flows-android, build-android, build-ios, build-desktop ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v7
        with:
          name: loak-release-android
          path: artifacts/release-assets-android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: loak-ios
          path: artifacts/release-assets-ios

      # The Nucleus generate-update-yml/publish-release composite actions scan
      # for `release-assets-*` directories; one per OS keeps the per-platform
      # latest-*.yml / alpha-*.yml manifests unambiguous (desktop artifacts
      # keep their `.blockmap` companions from the build-desktop step).
      - name: Download Linux desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-ubuntu-latest
          path: artifacts/release-assets-linux
          merge-multiple: true

      - name: Download Linux arm64 desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-ubuntu-24.04-arm
          path: artifacts/release-assets-linux
          merge-multiple: true

      - name: Download macOS desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-macos-26
          path: artifacts/release-assets-macos
          merge-multiple: true

      - name: Download Intel macOS desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-macos-15-intel
          path: artifacts/release-assets-macos
          merge-multiple: true

      - name: Download Windows desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-windows-latest
          path: artifacts/release-assets-windows
          merge-multiple: true

      - name: Download Windows arm64 desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loak-desktop-windows-11-arm
          path: artifacts/release-assets-windows
          merge-multiple: true

      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Keep the semantic tag version in updater metadata. Installer names use the
      # numeric package version derived by loakDesktop/build.gradle.kts.
      - name: Compute release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          build="$patch"
          if [[ "$version" == *-* && "$patch" == 0 ]]; then
            prerelease="${version#*-}"
            digits="${prerelease//[!0-9]/}"
            [ -z "$digits" ] || build="$digits"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=$major.$minor.$build" >> "$GITHUB_OUTPUT"

      - name: Exclude portable archives from update metadata
        shell: bash
        run: |
          mkdir -p artifacts/portable-assets
          find artifacts/release-assets-* -type f \
            \( -name 'Loak-*-Linux.tar.gz' -o -name 'Loak-*-Windows.zip' \) \
            -exec mv {} artifacts/portable-assets/ \;

      - name: Generate update YML
        uses: NucleusFramework/Nucleus/.github/actions/generate-update-yml@v2.5.18
        with:
          artifacts-path: artifacts
          version: ${{ steps.version.outputs.version }}
          channel: alpha

      - name: Restore portable release archives
        shell: bash
        run: |
          mkdir -p artifacts/release-assets-portable
          find artifacts/portable-assets -type f \
            -exec mv {} artifacts/release-assets-portable/ \;
          rmdir artifacts/portable-assets

      # Body with the per-platform download table: rendered as HTML so the Android
      # row can span both arch columns. The APK GitHub actually serves is the
      # apostrophe-stripped asset name (Lo'ak.apk is uploaded as Lo.ak.apk).
      # Written to a file: the HTML anchor tags contain double quotes, which would
      # break shell quoting if inlined as an expression.
      - name: Generate release description
        shell: bash
        run: |
          notes="$(
            .github/scripts/generate-release-notes.sh \
              "Lo'ak v${{ steps.version.outputs.version }}" \
              "${{ github.ref_name }}" \
              "loak-${{ steps.version.outputs.package_version }}-" \
              "Loak-" \
              "Lo.ak.apk" \
              "Loak.ipa" \
              "stable"
          )"
          printf '%s\n' "$notes" > release-notes.md

      # Published as `prerelease` on purpose (publish-release auto-generates
      # notes): GitHub's /releases/latest/* endpoints and the alpha channel
      # lookup only resolve published, non-draft releases — the auto-updater
      # cannot reach a draft. Pre-create with our download-table body (publish-release
      # then only uploads assets --clobber and leaves the body as-is).
      - name: Pre-create release with download table
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag \
            || true # already published by publish-release on a re-run; nothing to do

      - name: Publish Release
        uses: NucleusFramework/Nucleus/.github/actions/publish-release@v2.5.18
        with:
          artifacts-path: artifacts
          tag: ${{ github.ref_name }}
          release-type: prerelease

      - name: Update stable AltSource and commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Move the checkout to main so the manifest is committed against the
          # integration branch (the runner arrived detached at the tag).
          git fetch origin main
          git checkout main

          # The release IPA is live under /releases/download/{tag}; regenerate the
          # stable AltSource from the very file users will install and commit it to
          # main so the long-lived raw.githubusercontent URL stays current. The
          # generated file carries a fresh timestamp each run, so the push is
          # idempotent.
          .github/scripts/update-altsource.sh \
            --ipa artifacts/release-assets-ios/Loak.ipa \
            --source app-repo.json \
            --base "https://github.com/depau/loak/releases/download/${{ github.ref_name }}"

          if [[ -n "$(git status --porcelain -- app-repo.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-repo.json
            git commit -m "chore: update AltStore source for v${{ steps.version.outputs.version }}"
            git pull --rebase origin main --autostash
            git push origin main
          fi
