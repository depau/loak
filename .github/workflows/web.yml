name: Web

on:
  push:
    paths:
      - loak/**
      - webApp/**
      - loakUiTest/**
      - buildSrc/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/actions/**
      - .github/workflows/web.yml
      - "!**/strings.xml"
    branches:
      - '*'
  pull_request:
    paths:
      - loak/**
      - webApp/**
      - loakUiTest/**
      - buildSrc/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/actions/**
      - .github/workflows/web.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Kotlin/Wasm bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The flows check playback starts: the browsers need an audio output to play to
      - name: Set up a virtual audio output
        run: .github/scripts/setup-virtual-audio.sh

      # The user flows in headless Chrome and Firefox (Karma), against the Navidrome fixture;
      # a failure stops the deploy
      - name: Run user flows
        run: ./gradlew :webApp:wasmJsBrowserTest --no-daemon

      - name: Upload user flow failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-failures-web
          path: |
            webApp/build/reports/tests/wasmJsBrowserTest/
            build/navidrome-fixture/navidrome.log
          if-no-files-found: ignore

      - name: Build web distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Upload web bundle
        uses: actions/upload-artifact@v6
        with:
          name: lo-web
          path: webApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web bundle
        uses: actions/download-artifact@v7
        with:
          name: lo-web
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
