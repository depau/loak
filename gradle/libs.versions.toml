[versions]
agp = "9.3.2"
#noinspection UnusedVersionCatalogEntry
android-compileSdk = "37"
#noinspection UnusedVersionCatalogEntry
android-minSdk = "24"
#noinspection UnusedVersionCatalogEntry
android-targetSdk = "37"
kotlin = "2.4.21"
# desktop window chrome (client-side decorations, Tao backend). A 3.0 dev build for its macOS
# fix that stops drawing while the window is out of sight: drawing through a lid-closed sleep
# left the render thread stuck in CAMetalLayer.nextDrawable, the window frozen.
nucleus = "3.0.0-dev-202610230652"

# Androidx
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
# 3.1 (alpha) for setConnectionPoolTimeout: the web database turns its 30 s pool
# timeout off (see webDatabase); SQLite 2.8 is what Room 3.1 builds against
androidx-room3 = "3.1.0-alpha03"
androidx-sqlite = "2.8.0-alpha03"
kotlinx-browser = "0.5.0"
androidx-navigation3 = "1.2.0"
androidx-media3 = "1.11.1"
androidx-glance = "1.3.0-alpha02"

# Compose/UI
# Compose 1.12 (not 1.13): Nucleus, the desktop window decorations, implements
# Compose-internal interfaces and doesn't run on 1.13 yet (Nucleus #671).
compose = "1.12.2"
material3 = "1.12.0-alpha03"
#noinspection NewerVersionAvailable do not update this to alpha05 it makes the detail pane always visible
material3-adaptive = "1.3.0-alpha04"

# Compose 3rd party
kmpalette = "3.1.0"

# Networking
ktor = "3.5.2"
coil = "3.6.3"

# Misc
koin = "4.2.2"
mp3spi = "1.9.5.4"
# rodio: Rust rodio crate (Symphonia decoders: FLAC/AAC/Opus/Vorbis/MP3) via JNI.
# Separate from the nucleus versioned modules; latest published standalone.
nucleus-rodio = "1.0.2"
kotlinx-coroutines = "1.11.0"
androidx-test-runner = "1.7.0"
androidx-test-orchestrator = "1.6.1"
androidx-test-junit = "1.3.0"
# xerial sqlite-jdbc ships JVM natives (incl. aarch64) for every desktop arch;
# androidx's sqlite-bundled-jvm lacks windows_arm64 and dropped osx_x64 in 2.7.
sqlite-jdbc = "3.53.4.0"
# CoreGraphics calls (hiding the cursor on macOS); already pulled in transitively
jna = "5.19.1"

# Error reporting
# sentry KMP SDK + gradle plugin share one version; must stay in lockstep with
# the pinned Sentry Cocoa SDK (currently 8.58.2 for 0.27.0 — see README table).
sentry = "0.27.0"
# @sentry/browser (npm) for the web target, where the KMP SDK is a no-op stub
sentryBrowser = "11.7.0"

[libraries]
# Compose
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
cmp-material3-adaptive-nav = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "material3-adaptive" }
cmp-material3-windowSize = { module = "org.jetbrains.compose.material3:material3-window-size-class", version.ref = "material3" }
cmp-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
cmp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
cmp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }

# Androidx
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-animation-graphics = { group = "androidx.compose.animation", name = "animation-graphics", version = "1.12.1" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
androidx-sqlite-web-wasm-js = { module = "androidx.sqlite:sqlite-web-wasm-js", version.ref = "androidx-sqlite" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "androidx-room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "androidx-room3" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidx-media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "androidx-media3" }
androidx-media3-ktor = { module = "androidx.media3:media3-datasource-ktor", version.ref = "androidx-media3" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "androidx-glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "androidx-glance" }
androidx-browser = { module = "androidx.browser:browser", version = "1.10.0" }
androidx-work = { module = "androidx.work:work-runtime-ktx", version = "2.12.0" }

# Kotlinx
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.8.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.12.0" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version = "0.5.2" }

# Networking
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }

cmp-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
cmp-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidx-test-orchestrator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Compose 3rd party
capsule = { module = "top.ltfan.capsule:capsule", version = "1.1.1" }
wavySlider = { module = "ir.mahozad.multiplatform:wavy-slider", version = "2.2.0" }
kmpalette-core = { module = "com.kmpalette:kmpalette-core", version.ref = "kmpalette" }
materialKolor = { module = "com.materialkolor:material-kolor", version = "5.0.1" }
composePipette = { module = "dev.zt64.compose.pipette:compose-pipette", version = "2.0.0" }
multiplatformSettings = { module = "com.russhwolf:multiplatform-settings-no-arg", version = "1.3.0" }

# Misc
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
mp3spi = { module = "com.googlecode.soundlibs:mp3spi", version.ref = "mp3spi" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
nucleus-rodio = { module = "dev.nucleusframework:nucleus.rodio", version.ref = "nucleus-rodio" }
nucleus-menu-macos = { module = "dev.nucleusframework:nucleus.menu-macos", version.ref = "nucleus" }
nucleus-media-control = { module = "dev.nucleusframework:nucleus.media-control", version.ref = "nucleus" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
nucleus-system-color = { module = "dev.nucleusframework:nucleus.system-color", version.ref = "nucleus" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }
nucleus-decorated-window-tao = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus" }
nucleus-darkmode-detector = { module = "dev.nucleusframework:nucleus.darkmode-detector", version.ref = "nucleus" }
nucleus-updater-runtime = { module = "dev.nucleusframework:nucleus.updater-runtime", version.ref = "nucleus" }
subsonicKotlin = { module = "dev.zt64.subsonic:subsonic-client", version = "1.0.0-SNAPSHOT" }

# Error reporting
# Auto-installed into commonMain by the sentry gradle plugin; kept here so
# `:loak` also declares it explicitly (version source of truth).
sentryKmp = { module = "io.sentry:sentry-kotlin-multiplatform", version.ref = "sentry" }

[bundles]
cmp = ["cmp-foundation", "cmp-material3", "cmp-material3-adaptive-nav", "cmp-material3-windowSize", "cmp-resources", "cmp-runtime", "cmp-ui"]
coil = ["coil-compose", "coil-network-ktor3"]
media3 = ["androidx-media3-exoplayer", "androidx-media3-session", "androidx-media3-ktor"]
glance = ["androidx-glance-appwidget", "androidx-glance-material3"]
ktor = ["ktor-client-core", "ktor-client-contentNegotiation", "ktor-serialization-json"]
ktor-ios = ["ktor-client-darwin"]
ktor-android = ["ktor-client-okhttp"]
cmpThirdParty = ["capsule", "wavySlider", "materialKolor", "composePipette", "multiplatformSettings"]
androidx-android = ["androidx-activity-compose", "androidx-animation-graphics", "androidx-browser"]
androidx-lifecycle = ["androidx-lifecycle-viewmodel", "androidx-lifecycle-runtime"]
room = ["androidx-room3-runtime"]
koin = ["koin-core", "koin-compose", "koin-compose-viewmodel"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
valkyrie = { id = "io.github.composegears.valkyrie", version = "0.5.2" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.12" }
androidx-room3 = { id = "androidx.room3", version.ref = "androidx-room3" }
nucleus = { id = "dev.nucleusframework", version.ref = "nucleus" }
sentryKmp = { id = "io.sentry.kotlin.multiplatform.gradle", version.ref = "sentry" }
